<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Buen Fin en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F4EE;--ink:#231F20;--muted:#5F5A55;--line:#E4DFD6;--track:#EFEAE2;--card:#FFF;--goal:#E4DFD6;--mid:#8C857C;--pace:#E8A33D;--ly:#C26A12;--good:#1E6B45;--good-bg:#E3F0E8;--good-ink:#14532F;--warn-bg:#F6EAD3;--warn-ink:#5C3700;--bad:#A1271F;--bad-bg:#F5DEDB;--bad-ink:#7A1D17;--soft:#CFC8BD}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif}
h1,h2,p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:32px 24px 64px;display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.kicker{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font-size:32px;font-weight:800;letter-spacing:-.01em;margin-top:6px}
h2{font-size:20px;font-weight:800}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.stale{color:var(--bad);font-weight:700}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:inherit;font-size:14px;font-weight:600;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #DCD6CC;background:var(--card);color:var(--ink);cursor:pointer}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.alerts{display:flex;flex-wrap:wrap;gap:10px}
.alert{display:flex;gap:8px;align-items:center;padding:10px 14px;border-radius:12px;font-size:14px}
.alert b{font-weight:700}
.warn{background:var(--warn-bg);color:var(--warn-ink)}.bad{background:var(--bad-bg);color:var(--bad-ink)}.good{background:var(--good-bg);color:var(--good-ink)}.neutral{background:var(--track);color:#3D3835}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card.pace{gap:10px}
.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dark .lab,.dark .note{color:var(--soft)}
.lab{font-size:13px;font-weight:600;color:var(--muted)}
.big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.note{font-size:14px;color:var(--muted)}
.small{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:999px;background:var(--track);position:relative;overflow:hidden}
.dark .bar{background:#4A4440}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:999px}
.dark .bar>i{background:var(--bg)}
.bar>u{position:absolute;top:0;bottom:0;width:2px;background:var(--pace)}
.bar.t{height:14px}.bar.m{height:12px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-block}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.scen{display:flex;gap:4px}
.scen div{flex:1;text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-radius:6px;background:var(--track);color:var(--muted)}
.scen div.on{background:var(--ink);color:var(--bg)}
.action{display:flex;align-items:center;gap:10px;border-radius:12px;padding:10px 16px;font-size:15px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px}
.kpi{background:var(--bg);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.kpi .lab{font-size:12px}
.kpi b{font-size:26px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.chart{position:relative;height:200px;border-bottom:1px solid #DCD6CC}
.rule{position:absolute;left:0;right:0;border-top:2px dashed}
.rule span{position:absolute;right:0;top:-9px;font-size:11px;font-weight:700;background:var(--card);padding:0 4px}
.bars{position:absolute;inset:0;display:flex;align-items:flex-end;gap:10px;padding:0 140px 0 8px}
.bars>div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;font-weight:700}
.bars>div i{display:block;width:100%;max-width:44px;border-radius:6px 6px 0 0}
.labels{display:flex;gap:10px;padding:0 140px 0 8px}
.labels div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .spread{font-size:13px;flex-wrap:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);padding:6px 0;font-weight:600}
td{padding:8px 8px 8px 0;border-top:1px solid var(--track);font-variant-numeric:tabular-nums}
.r{text-align:right;padding-right:0;padding-left:12px;white-space:nowrap}
.scroll{overflow-x:auto}
.hours,.cal{display:flex;align-items:flex-end;position:relative}
.hours{height:220px;gap:4px}.cal{height:200px;gap:6px}
.hours>div,.cal>div{flex:1;height:100%;position:relative}
.hours i,.cal i{position:absolute;bottom:0;border-radius:4px 4px 0 0}
.goalbar{left:0;right:0;background:var(--goal)}
.realbar{left:18%;right:18%;background:var(--ink)}
.realbar.now{background:var(--mid)}
.axis{display:flex}.axis div{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:6px 0;border-top:1px solid var(--track)}
.line span{color:var(--muted)}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:560px){.mini{grid-template-columns:1fr}.bars,.labels{padding-right:96px;gap:4px}h1{font-size:26px}.big{font-size:38px}}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px}
.phase{border-radius:12px;padding:12px 14px;background:var(--bg)}
.phase.on{background:var(--ink);color:var(--bg)}
.phase b{display:block;font-size:18px;font-weight:800}
.phase small{font-size:12px;display:block}
.decision{background:var(--ink);color:var(--bg);border-radius:16px;padding:28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:20px}
.decision h2{font-size:30px;letter-spacing:-.01em}
.stat{background:#3A3431;border-radius:12px;padding:14px 18px;min-width:140px}
.stat b{font-size:28px;font-weight:800;display:block}
#gate{min-height:100vh;display:grid;place-items:center;padding:24px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:14px;width:min(380px,100%)}
#gate label{font-size:14px;font-weight:600}
#gate input{font:inherit;min-height:44px;padding:0 12px;border:1px solid #DCD6CC;border-radius:10px}
#gate button{font:inherit;font-weight:700;min-height:44px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);cursor:pointer}
#err{font-size:13px;color:var(--bad);min-height:18px}
.split{line-height:1.5}.dark .split{color:var(--soft)}.split strong{color:inherit;font-weight:700}
.link{font:inherit;font-weight:700;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;text-align:left}
nav[aria-label=Marca]{border-bottom:1px solid var(--line);padding-bottom:16px}
</style>
</head>
<body>
<main id="gate">
<form id="login">
<div class="kicker">IncuBrands</div>
<h1>Buen Fin 2026</h1>
<label for="pw">Contraseña</label>
<input id="pw" type="password" autocomplete="current-password" required>
<button type="submit">Entrar</button>
<div id="err" role="alert"></div>
</form>
</main>
<main id="app" hidden></main>
<script>
const DAYS=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
const M=(v)=>{if(v===null||v===undefined||Number.isNaN(v))return"—";const a=Math.abs(v);if(a>=1e6)return"$"+(v/1e6).toFixed(2)+"M";if(a>=1e4)return"$"+Math.round(v/1e3)+"k";return"$"+Math.round(v).toLocaleString("en-US")};
const X=(v,d=2)=>v===null||v===undefined?"—":v.toFixed(d)+"x";
const P=(v,d=0)=>v===null||v===undefined?"—":(v*100).toFixed(d)+"%";
const esc=(t)=>String(t??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp=(v)=>Math.max(0,Math.min(100,v));
const dayLabel=(iso)=>{const d=new Date(iso+"T12:00:00Z");return DAYS[d.getUTCDay()]+" "+d.getUTCDate()+" nov"};
const paceClass=(p)=>p===null?"neutral":p>=1?"good":p>=.9?"warn":"bad";
const clock=(iso)=>iso?new Date(iso).toLocaleTimeString("es-MX",{timeZone:"America/Mexico_City",hour:"2-digit",minute:"2-digit",hour12:false}):"—";
const prog=(label,value,pct,marker)=>`<div class="prog"><div class="spread"><span>${label}</span><strong>${value}</strong></div><div class="bar t"><i style="width:${clamp(pct*100)}%"></i>${marker!==undefined?`<u style="left:${clamp(marker*100)}%"></u>`:""}</div></div>`;
const kpi=(l,v,s)=>`<div class="kpi"><div class="lab">${l}</div><b>${v}</b><div class="small">${s}</div></div>`;

// Ruta: #general, #<marca> (en vivo) o #<marca>-cierre. #cierre y #vivo vienen del tablero de una sola marca (Twins).
const route=()=>{const h=location.hash.slice(1);if(h==="cierre")return{brand:"twins",view:"cierre"};if(!h||h==="vivo"||h==="general")return{brand:h==="vivo"?"twins":"general",view:"vivo"};const[b,v]=h.split("-");return{brand:b,view:v==="cierre"?"cierre":"vivo"}};
let data=null,{brand,view}=route(),key=null,lastText="";
const go=(b,v)=>{brand=b;view=v;history.replaceState(null,"",b==="general"?"#general":v==="cierre"?`#${b}-cierre`:`#${b}`);render()};

function brandNav(){
  const tabs=[["general","General"],...data.order.map(id=>[id,data.brands[id].name])];
  return `<nav aria-label="Marca">${tabs.map(([id,name])=>`<button data-b="${id}" aria-pressed="${brand===id}">${esc(name)}</button>`).join("")}</nav>`;
}

function head(d){
  const title=view==="vivo"?`${dayLabel(d.today)} · ${d.phase?d.phase.name:"Noviembre"}`:(d.close?`Cierre del ${dayLabel(d.close.date)}`:"Cierre de ayer");
  const age=Math.round((Date.now()-Date.parse(d.generatedAt))/60000);
  const stale=age>20||d.stale?`<span class="stale"> · Sin actualizar hace ${age} min</span>`:"";
  return `${brandNav()}<header><div><div class="kicker">${esc(d.name)} · ${view==="vivo"?"Buen Fin 2026":"Revisión de las 10 am"}</div><h1>${title}</h1><div class="sub">Shopify ${clock(d.generatedAt)} · Meta Ads sin cambio desde ${clock(d.meta.track?.changedAt)} · Klaviyo ${clock(d.klaviyo?.at)} · Montos con IVA${stale}</div></div><nav aria-label="Vista"><button data-v="vivo" aria-pressed="${view==="vivo"}">En vivo</button><button data-v="cierre" aria-pressed="${view==="cierre"}">Cierre de ayer</button></nav></header>`;
}

// Tarjeta de contribution margin: costos de Triple Whale, todos los canales, después de Meta Ads.
function cmCard(cm,label){
  if(!cm)return `<div class="card pace"><div class="lab">Contribution margin</div><div class="big">—</div><div class="note">Faltan los costos de Triple Whale de esta marca</div></div>`;
  const t=cm.today??cm,y=cm.yesterday,p=cm.promo;
  return `<div class="card pace"><div class="lab">Contribution margin ${label}</div><div class="big">${M(t?.value)}</div><div class="note">${P(t?.pct,1)} de la venta sin IVA · después de Meta Ads</div>${y?`<div class="note">Ayer ${M(y.value)} · ${P(y.pct,1)}</div>`:""}${p?`<div class="note">Acumulado promo ${M(p.value)} · ${P(p.pct,1)}</div>`:""}<div class="small">Costos de Triple Whale: COGS, IVA, envío, pasarela y fulfillment${t?.partial?" · sin la marca que no tiene costos":""}</div></div>`;
}

function live(d){
  const m=d.month,day=d.day,meta=d.meta,limits=d.limits,monthPct=m.mtd/d.goal,mark=m.expected/d.goal,monthPace=m.expected?m.mtd/m.expected:null;
  const scen=[.8,.93,1,1.07,1.2,1.33].map(f=>Math.round(d.goal*f/1e5)/10),pick=scen.reduce((a,b)=>Math.abs(b*1e6-m.projection)<Math.abs(a*1e6-m.projection)?b:a);
  const alerts=d.alerts.length?d.alerts.map(a=>`<div class="alert ${a.level}"><b>${esc(a.tag)}</b><span>${esc(a.text)}</span></div>`).join(""):`<div class="alert good"><b>Sin alertas</b><span>Todo dentro del plan a esta hora</span></div>`;
  const lyCmp=day.lySoFar&&day.lySoFar>0?`<span class="small">vs misma fecha 2025 a esta hora: ${day.real>=day.lySoFar?"+":""}${Math.round((day.real/day.lySoFar-1)*100)}%</span>`:"";
  const actionClass={subir:"good",mantener:"warn",bajar:"bad"}[d.decision.action];
  const hist=meta.history,top=Math.max(4,...hist.map(h=>(h.nc||0)*1.15),limits.obj*1.2);
  const bars=hist.map(h=>`<div>${h.nc===null?"—":h.nc.toFixed(1)+"x"}<i style="height:${((h.nc||0)/top*100*.86).toFixed(1)}%;background:${h.today?"var(--mid)":h.nc>=limits.obj?"var(--good)":h.nc>=limits.piso?"var(--ink)":"var(--bad)"}"></i></div>`).join("");
  const labels=hist.map(h=>`<div>${Number(h.date.slice(8))}${h.today?" hoy":""}</div>`).join("");
  const rule=(v,c,t)=>`<div class="rule" style="bottom:${(v/top*100*.86).toFixed(1)}%;border-color:${c}"><span style="color:${c}">${t}</span></div>`;
  const ads=meta.ads.map(a=>`<tr><td>${esc(a.name)}</td><td class="r">${M(a.spend)}</td><td class="r">${X(a.roas,1)}</td><td class="r">${M(a.cpa)}</td></tr>`).join("")||`<tr><td colspan="4">Sin gasto registrado hoy</td></tr>`;
  const hm=Math.max(...d.hours.goal,...d.hours.real,...(d.hours.ly||[0]))||1;
  const hours=d.hours.goal.map((g,i)=>{const r=d.hours.real[i];return `<div><i class="goalbar" style="height:${(g/hm*92).toFixed(1)}%"></i>${i<=d.hours.nowHour?`<i class="realbar${i===d.hours.nowHour?" now":""}" style="height:${(r/hm*92).toFixed(1)}%"></i>`:""}</div>`}).join("");
  const lyPath=d.hours.ly?"M"+d.hours.ly.map((v,i)=>`${((i+.5)*10).toFixed(1)},${(100-v/hm*92).toFixed(1)}`).join(" L"):"";
  const axis=d.hours.goal.map((_,i)=>`<div>${i%3===0?i+"h":""}</div>`).join("");
  const channels=d.channels.map(c=>`<div class="prog"><div class="spread" style="font-size:14px;align-items:baseline"><strong>${c.label}</strong><span>${M(c.value)} <span style="color:var(--muted)">de ${M(c.goal)}</span></span></div><div class="bar m"><i style="width:${clamp(c.goal?c.value/c.goal*100:0)}%"></i><u style="left:${clamp(d.frac*100)}%"></u></div><div class="small">${c.goal?P(c.value/c.goal):"—"} del objetivo del día · ${P(c.share)} de la venta</div></div>`).join("");
  const aovDelta=d.ticket.aov?d.ticket.aov/d.ticket.base-1:null;
  const k=d.klaviyo;
  const sends=k?(k.sends.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.hour?String(s.hour.hour).padStart(2,"0")+":"+String(s.hour.minute).padStart(2,"0"):"—"}</td><td class="r">${M(s.revenue)}</td><td class="r">${s.recipients?"$"+(s.revenue/s.recipients).toFixed(2):"—"}</td></tr>`).join("")||`<tr><td colspan="4">Sin envíos desde ayer</td></tr>`):`<tr><td colspan="4">Klaviyo sin dato todavía</td></tr>`;
  const flowRows=k?((k.flows||[]).map(f=>`<tr><td>${esc(f.name)}</td><td class="r">${M(f.today)}</td><td class="r">${M(f.yesterday)}</td></tr>`).join("")||`<tr><td colspan="3">Sin venta de flows desde ayer</td></tr>`):`<tr><td colspan="3">Klaviyo sin dato todavía</td></tr>`;
  const stock=d.stock.map(s=>`<tr><td>${esc(s.name)}</td><td class="r">${s.units.toLocaleString("en-US")}</td><td class="r">${s.inventory===null?"—":s.inventory.toLocaleString("en-US")}</td><td class="r">${s.days===null?"—":`<span${s.days<3?' class="pill bad"':""}>${s.days.toFixed(1)}</span>`}</td></tr>`).join("");
  const cm=Math.max(...d.calendar.map(c=>Math.max(c.goal,c.real||0)))||1;
  const cal=d.calendar.map(c=>`<div><i class="goalbar" style="height:${(c.goal/cm*100).toFixed(1)}%"></i>${c.real!==null?`<i class="realbar${c.today?" now":""}" style="left:20%;right:20%;height:${(c.real/cm*100).toFixed(1)}%"></i>`:""}</div>`).join("");
  const calAxis=d.calendar.map(c=>`<div>${Number(c.date.slice(8))}</div>`).join("");
  const phases=d.phases.map(p=>`<div class="phase${p.active?" on":""}"><small style="font-weight:700">${p.name} · ${p.label}</small><b>${p.real===null?"—":M(p.real)}</b><small>objetivo ${M(p.total)}${p.real!==null?" · "+P(p.real/p.total):""}</small></div>`).join("");
  const metaToday=meta.today;
  return head(d)+`
<section class="alerts" aria-label="Alertas">${alerts}</section>
<section class="grid4" aria-label="Pacing">
<div class="card pace dark"><div class="lab">Noviembre vs objetivo</div><div class="big">${M(m.mtd)}</div><div class="note">de ${M(d.goal)} · faltan ${M(m.faltan)}</div><div class="bar"><i style="width:${clamp(monthPct*100)}%"></i><u style="left:${clamp(mark*100)}%"></u></div><div class="note" style="font-size:13px">Deberíamos ir en ${M(m.expected)} (línea naranja) · <strong style="color:#F2C27A">${P(monthPace)} del pacing</strong></div></div>
<div class="card pace"><div class="lab">Hoy vs objetivo del día</div><div class="big">${M(day.real)}</div><div class="note">Objetivo del día ${M(day.plan?.total)} · a esta hora ${M(day.expected)}</div><div class="note">Cierre proyectado <strong>${day.projection==null?"—":M(day.projection)}</strong> · ${day.projection!=null&&day.plan?.total?P(day.projection/day.plan.total)+" del objetivo":"se calcula después de las primeras horas"}</div><div class="row"><span class="pill ${paceClass(day.pace)}">${P(day.pace)} del pacing</span>${lyCmp}</div></div>
<div class="card pace"><div class="lab">${d.phase?`Fase ${d.phase.name} (${d.phase.label} nov)`:"Fase"}</div><div class="big">${M(d.phase?.real)}</div><div class="note">de ${M(d.phase?.total)} · Ecomm ${M(d.phase?.ecommReal)} de ${M(d.phase?.ecomm)}</div><div class="bar"><i style="width:${clamp(d.phase?d.phase.real/d.phase.total*100:0)}%"></i></div></div>
<div class="card pace"><div class="lab">Proyección de cierre de mes</div><div class="big">${M(m.projection)}</div><div class="note">Al ritmo actual · ${P(m.ratio)} del plan</div><div class="scen" aria-label="Escenarios">${scen.map(s=>`<div class="${s===pick?"on":""}">${s}M</div>`).join("")}</div></div>
${cmCard(d.cm,"hoy")}
</section>
<section class="card" aria-label="Meta Ads" style="gap:20px">
<div class="spread"><h2>Meta Ads · ¿subo, mantengo o bajo?</h2><div class="action ${actionClass}"><strong>Acción: ${d.decision.action}</strong><span>${esc(d.decision.reason)}</span></div></div>
<div class="kpis">
${kpi("Gasto hoy",M(metaToday.spend),`Plan ${M(metaToday.plan15)} · para escalar ${M(metaToday.plan20)}`)}
${kpi("NC-ROAS hoy",X(metaToday.nc),`Objetivo 20%: ${X(limits.obj)} · piso ${X(limits.piso)}`)}
${kpi("Margen clientes nuevos",P(metaToday.margin,1),"Después de Meta · objetivo 20%")}
${kpi("MER web hoy",X(metaToday.mer),"Venta ecomm ÷ gasto Meta")}
${kpi("CAC cliente nuevo",M(metaToday.cac),`Máximo al 20%: ${M(limits.cacMax)}`)}
${kpi("CPM · frecuencia",`$${Math.round(metaToday.cpm)} · ${metaToday.frequency.toFixed(1)}`,`Oct: $${Math.round(meta.oct.cpm)} · ${meta.oct.frequency.toFixed(1)}`)}
</div>
<div class="grid3" style="gap:24px">

function closeView(d){

${top("Venta de ayer",M(c.day.total),`Objetivo del día ${M(pl.total)} · 2025: ${M(pl.lyTotal)}`,`${P(pct(c.day.total,pl.total))} del objetivo`,paceClass(pct(c.day.total,pl.total)))}
${top("Noviembre acumulado",M(c.mtd),`Deberíamos ir en ${M(c.mtdExpected)} de ${M(d.goal)}`,`${P(pct(c.mtd,c.mtdExpected))} del pacing`,paceClass(pct(c.mtd,c.mtdExpected)))}
${top("Gasto Meta Ads ayer",M(m?.spend),`Plan ${M(m?.plan15)} · 2025: ${M(m?.ly)}`,`${P(m?pct(m.spend,m.plan15):null)} del plan`,"neutral")}

function generalView(g){
  const age=Math.round((Date.now()-Date.parse(g.generatedAt))/60000);
  const lagging=data.order.filter(id=>data.brands[id].stale||data.brands[id].error).map(id=>data.brands[id].name);
  const warn=age>20?`<span class="stale"> · Sin actualizar hace ${age} min</span>`:lagging.length?`<span class="stale"> · ${esc(lagging.join(", "))} sin actualizar</span>`:"";
  const monthPace=g.month.expected?g.month.mtd/g.month.expected:null,dayPace=g.day.expected?g.day.real/g.day.expected:null;
  // Desglose en chiquito debajo de cada total: cuánto aporta cada marca.
  const split=(fn)=>`<div class="small split">${g.brands.map(b=>`${esc(b.name)} <strong>${fn(b)}</strong>`).join(" · ")}</div>`;
  const cmSplit=(pick)=>split(b=>b.cm?.[pick]?`${M(b.cm[pick].value)} (${P(b.cm[pick].pct,1)})`:"sin costos");
  const brandRows=g.brands.map(b=>`<tr><td><button class="link" data-b="${b.id}">${esc(b.name)}</button></td><td class="r">${M(b.day.real)}</td><td class="r">${M(b.day.goal)}</td><td class="r"><span class="pill ${paceClass(b.day.pace)}">${P(b.day.pace)}</span></td><td class="r">${M(b.day.projection)}</td><td class="r">${M(b.month.mtd)}</td><td class="r">${M(b.goal)}</td><td class="r">${M(b.month.projection)}</td><td class="r">${M(b.cm?.today?.value)}</td><td class="r">${P(b.cm?.today?.pct,1)}</td><td class="r">${M(b.spend)}</td></tr>`).join("");

  const channelCards=g.brands.map(b=>{
    const y=Object.fromEntries((b.channelsYesterday||[]).map(c=>[c.label,c.value]));
    const rows=b.channels.map(c=>`<tr><td>${esc(c.label)}</td><td class="r">${M(c.value)}</td><td class="r">${c.goal?M(c.goal):"—"}</td><td class="r">${c.goal?`<span class="pill ${paceClass(c.value/c.goal/(g.day.goal&&g.day.expected?g.day.expected/g.day.goal:1))}">${P(c.value/c.goal)}</span>`:"—"}</td><td class="r">${M(y[c.label])}</td></tr>`).join("");
    return `<div class="card"><div class="spread"><h2>${esc(b.name)}</h2><button class="link" data-b="${b.id}">Ver marca</button></div><div class="scroll"><table><thead><tr><th>Canal</th><th class="r">Hoy</th><th class="r">Objetivo del día</th><th class="r">% del objetivo</th><th class="r">Ayer</th></tr></thead><tbody>${rows}</tbody></table></div><div class="row"><span class="small">${b.cm?`Contribution margin hoy ${M(b.cm.today?.value)} (${P(b.cm.today?.pct,1)}) · ayer ${M(b.cm.yesterday?.value)} (${P(b.cm.yesterday?.pct,1)})`:"Contribution margin: faltan los costos de Triple Whale de esta marca"}</span></div></div>`;

  return `${brandNav()}<header><div><div class="kicker">IncuBrands · Buen Fin 2026</div><h1>${dayLabel(g.today)} · General</h1><div class="sub">Actualizado ${clock(g.generatedAt)} · Montos con IVA${warn}</div></div></header>

<div class="card pace"><div class="lab">Hoy vs objetivo del día</div><div class="big">${M(g.day.real)}</div><div class="note">Objetivo del día ${M(g.day.goal)} · a esta hora ${M(g.day.expected)}</div><div class="note">Cierre proyectado <strong>${M(g.day.projection)}</strong>${g.day.projection!=null&&g.day.goal?" · "+P(g.day.projection/g.day.goal)+" del objetivo":""}</div><div class="row"><span class="pill ${paceClass(dayPace)}">${P(dayPace)} del pacing</span></div>${split(b=>`${M(b.day.real)} de ${M(b.day.goal)}`)}</div>
<div class="card pace"><div class="lab">Proyección de cierre de mes</div><div class="big">${M(g.month.projection)}</div><div class="note">Objetivo ${M(g.goal)} · ${g.month.projection>=g.goal?"+":"−"}${M(Math.abs(g.month.projection-g.goal))}</div><div class="note">Ayer cerró en ${M(g.yesterday.real)} de ${M(g.yesterday.goal)}</div>${split(b=>M(b.month.projection))}</div>
<div class="card pace"><div class="lab">Contribution margin hoy · todas las marcas</div><div class="big">${M(g.cm.today?.value)}</div><div class="note">${P(g.cm.today?.pct,1)} de la venta sin IVA · después de Meta Ads</div>${cmSplit("today")}<div class="note">Ayer ${M(g.cm.yesterday?.value)} · ${P(g.cm.yesterday?.pct,1)}</div>${cmSplit("yesterday")}<div class="note">Acumulado promo ${M(g.cm.promo?.value)} · ${P(g.cm.promo?.pct,1)}</div>${cmSplit("promo")}<div class="small">Costos de Triple Whale: COGS, IVA, envío, pasarela y fulfillment</div></div>
</section>
<section class="card" aria-label="Por marca"><h2>Por marca</h2><div class="scroll"><table style="min-width:980px;font-size:14px"><thead><tr><th>Marca</th><th class="r">Hoy</th><th class="r">Objetivo hoy</th><th class="r">Pacing</th><th class="r">Proyección día</th><th class="r">Noviembre</th><th class="r">Objetivo mes</th><th class="r">Proyección mes</th><th class="r">CM hoy</th><th class="r">CM %</th><th class="r">Meta Ads hoy</th></tr></thead><tbody>${brandRows}${totalRow}</tbody></table></div><div class="small">Contribution margin con los costos de Triple Whale, todos los canales, después de Meta Ads. % sobre la venta sin IVA.${g.brands.some(b=>!b.cm)?` El total no incluye a ${esc(g.brands.filter(b=>!b.cm).map(b=>b.name).join(", "))} hasta tener sus costos.`:""}</div></section>
<section class="grid2" aria-label="Venta por canal">${channelCards}</section>`;
}

function render(){
  if(!data)return;
  const app=document.getElementById("app"),y=scrollY;
  const d=data.brands[brand];
  if(brand!=="general"&&!d){brand="general"}
  let body;
  if(brand==="general")body=data.general?generalView(data.general):`${brandNav()}<section class="card"><h2>Todavía no hay datos generales</h2></section>`;
  else if(d.error)body=`${brandNav()}<section class="card"><h2>${esc(d.name)} todavía no tiene datos</h2><div class="note">La conexión de esta marca no respondió en la última actualización.</div></section>`;
  else body=view==="vivo"?live(d):closeView(d);
  app.innerHTML=`<div class="wrap">${body}</div>`;
  scrollTo(0,y);
}

async function deriveKey(password,salt,iterations){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
}
const bytes=(t)=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function load(password){
  const res=await fetch("data.enc?ts="+Date.now(),{cache:"no-store"});
  if(!res.ok)throw new Error("sin-datos");
  const text=await res.text();
  if(text===lastText&&data)return false;
  const box=JSON.parse(text),salt=bytes(box.s);
  const k=await deriveKey(password,salt,box.n);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(box.i)},k,bytes(box.c));
  data=JSON.parse(new TextDecoder().decode(plain));lastText=text;
  // Datos del tablero de una sola marca: se muestran como Twins.
  if(!data.brands)data={order:["twins"],brands:{twins:{...data,id:"twins",name:"Twins & Icons"}},general:null};
  return true;
}
async function enter(password){
  await load(password);
  key=password;
  try{sessionStorage.setItem("bf-pw",password)}catch{}
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  render();
  setInterval(async()=>{try{if(await load(key))render();else render()}catch{}},60000);
}
document.getElementById("login").addEventListener("submit",async(e)=>{
  e.preventDefault();
  const err=document.getElementById("err");err.textContent="";
  try{await enter(document.getElementById("pw").value)}
  catch(x){err.textContent=x.message==="sin-datos"?"Todavía no hay datos publicados.":"Contraseña incorrecta."}
});
document.addEventListener("click",(e)=>{
  const v=e.target.closest("button[data-v]"),b=e.target.closest("button[data-b]");
  if(v)go(brand,v.dataset.v);
  else if(b)go(b.dataset.b,b.dataset.b==="general"?"vivo":view);
});
addEventListener("hashchange",()=>{({brand,view}=route());render()});
try{const saved=sessionStorage.getItem("bf-pw");if(saved)enter(saved).catch(()=>{})}catch{}
</script>
